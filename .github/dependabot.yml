version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/apps/web/"
    schedule:
      interval: "daily"

  - package-ecosystem: "composer"
    directory: "/apps/api/"
    schedule:
      interval: "daily"

  - package-ecosystem: "docker"
    directories:
      - "/services/*/"
    schedule:
      interval: "daily"
