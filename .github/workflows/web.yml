name: web
run-name: ${{ github.event_name }}-${{ github.ref_name }}
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
    branches:
      - main

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.should_skip.outputs.should_skip }}
    steps:
      - name: Check if the commit message contains [skip ci]
        id: should_skip
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]]; then
            echo "should_skip=true" >> $GITHUB_ENV
          else
            echo "should_skip=false" >> $GITHUB_ENV
          fi

  lint_and_tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run web lint check
        run: task web:lint-check

      - name: Run web tests
        run: task web:test
