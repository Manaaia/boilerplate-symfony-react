name: web
run-name: ${{ github.event_name }}-${{ github.ref_name }}
on:
  push:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
    branches:
      - main

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.should_skip.outputs.should_skip }}
    steps:
      - name: Check if the commit message contains [skip ci]
        id: should_skip
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]]; then
            echo "should_skip=true" >> $GITHUB_ENV
          else
            echo "should_skip=false" >> $GITHUB_ENV
          fi

  check_files_changed:
    runs-on: ubuntu-latest
    needs: [pre_job]
    outputs:
      web_changed: ${{ steps.check_changes.outputs.web_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for changes in web directory and github workflows
        id: check_changes
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -q '^web/'|'^workflows/'; then
            echo "web_changed=true" >> $GITHUB_ENV
          else
            echo "web_changed=false" >> $GITHUB_ENV
          fi

  lint_and_tests:
    runs-on: ubuntu-latest
    needs: [check_files_changed]
    if: needs.check_files_changed.outputs.web_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run web lint check
        run: task web:lint-check

      - name: Run web tests
        run: task web:test
