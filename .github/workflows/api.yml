name: api
run-name: ${{ github.event_name }}-${{ github.ref_name }}
on:
  push:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
    branches:
      - main
  pull_request:
    paths:
      - 'api/**'
      - '.github/workflows/api.yml'
    branches:
      - main

jobs:
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.should_skip.outputs.should_skip }}
    steps:
      - name: Check if the commit message contains [skip ci]
        id: should_skip
        run: |
          if [[ "${{ github.event.head_commit.message }}" == *"[skip ci]"* ]]; then
            echo "should_skip=true" >> $GITHUB_ENV
          else
            echo "should_skip=false" >> $GITHUB_ENV
          fi

  check_files_changed:
    runs-on: ubuntu-latest
    needs: [pre_job]
    outputs:
      api_changed: ${{ steps.check_changes.outputs.api_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Check for changes in api directory and github workflows
        id: check_changes
        run: |
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -q '^api/'|'.github/'; then
            echo "api_changed=true" >> $GITHUB_ENV
          else
            echo "api_changed=false" >> $GITHUB_ENV
          fi

  lint_and_tests:
    runs-on: ubuntu-latest
    needs: [check_files_changed]
    # if: pre_job.outputs.should_skip == 'false' && check_files_changed.outputs.api_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Run api static analysis
        run: task api:static-analysis

      - name: Run api lint check
        run: task api:lint-check

      - name: Run api tests
        run: task api:test
